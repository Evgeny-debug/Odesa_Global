<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Справочник Измаил</title>
    <style>
        :root {
            /* Палитра новейшего Telegram (Night) */
            --bg-black: #000000;
            --bg-panel: #1c1c1e;
            --glass-bg: rgba(28, 28, 30, 0.75);
            --glass-border: rgba(255, 255, 255, 0.08);
            --accent: #0A84FF; /* iOS Blue */
            --text-main: #ffffff;
            --text-sub: #8e8e93;
            --header-h: 56px;
            --nav-h: 60px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body {
            background-color: var(--bg-black);
            color: var(--text-main);
            padding-top: var(--header-h); 
            padding-bottom: calc(var(--nav-h) + 10px);
            font-size: 14px;
            overflow-x: hidden;
        }

        /* Ультра-глассморфизм */
        .glass {
            background: var(--glass-bg);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
        }

        /* --- Шапка --- */
        header {
            position: fixed; top: 0; left: 0; right: 0;
            height: var(--header-h);
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 12px;
            z-index: 1000;
        }
        .search-bar {
            flex: 1; background: var(--bg-panel); border-radius: 10px; height: 36px;
            display: flex; align-items: center; padding: 0 10px; gap: 8px; margin: 0 8px;
        }
        .search-bar input { background: transparent; border: none; color: #fff; width: 100%; outline: none; font-size: 15px; }
        .search-bar input::placeholder { color: var(--text-sub); }
        .header-icon { width: 28px; height: 28px; fill: var(--text-sub); }

        /* --- Навигация --- */
        nav {
            position: fixed; bottom: 0; left: 0; right: 0;
            height: var(--nav-h);
            border-top: 1px solid var(--glass-border);
            display: flex; justify-content: space-around; align-items: center;
            z-index: 1000;
            padding-bottom: env(safe-area-inset-bottom);
        }
        .nav-item { display: flex; flex-direction: column; align-items: center; gap: 2px; color: var(--text-sub); width: 100%; cursor: pointer; }
        .nav-item svg { width: 24px; height: 24px; fill: currentColor; }
        .nav-item span { font-size: 10px; font-weight: 500; }
        .nav-item.active { color: var(--accent); }
        .badge { position: absolute; background: #FF3B30; color: #fff; font-size: 10px; padding: 2px 5px; border-radius: 10px; top: -2px; right: 20px; border: 2px solid var(--glass-bg); }

        /* --- Контейнер --- */
        #app { padding: 4px; animation: fade 0.2s; }
        @keyframes fade { from { opacity: 0; } to { opacity: 1; } }

        /* --- Скролбары (Glovo Style) --- */
        .h-scroll {
            display: flex; gap: 8px; overflow-x: auto; padding: 8px 4px;
            scroll-snap-type: x mandatory; scrollbar-width: none;
        }
        .h-scroll::-webkit-scrollbar { display: none; }
        
        /* Мини-категории (Сториз) */
        .story-bubble { display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 60px; scroll-snap-align: start; }
        .story-img { width: 56px; height: 56px; border-radius: 50%; border: 2px solid var(--accent); padding: 2px; background: var(--bg-black); object-fit: cover; }
        .story-text { font-size: 11px; white-space: nowrap; text-overflow: ellipsis; overflow: hidden; width: 100%; text-align: center; }

        /* Сетка категорий */
        .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; padding: 4px; }
        .cat-card { background: var(--bg-panel); border-radius: 10px; padding: 10px 4px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 6px; }
        .cat-card img { width: 40px; height: 40px; object-fit: contain; }
        .cat-card span { font-size: 12px; font-weight: 500; }

        /* Лента Рекламы */
        .ad-card { background: var(--bg-panel); border-radius: 12px; overflow: hidden; margin-bottom: 8px; }
        .ad-img { width: 100%; height: 160px; object-fit: cover; }
        .ad-info { padding: 8px; display: flex; flex-direction: column; gap: 4px; }
        .ad-price { color: var(--accent); font-weight: 600; font-size: 15px; }
        
        /* --- Чаты (Копия скриншота) --- */
        .chat-tabs { display: flex; overflow-x: auto; gap: 8px; padding: 8px 12px; scrollbar-width: none; border-bottom: 1px solid var(--glass-border); }
        .chat-tabs::-webkit-scrollbar { display: none; }
        .chat-tab { background: transparent; color: var(--text-sub); font-size: 15px; white-space: nowrap; padding: 4px 8px; border-radius: 16px; font-weight: 500; }
        .chat-tab.active { background: var(--glass-border); color: var(--text-main); }
        
        .chat-item { display: flex; align-items: center; gap: 10px; padding: 6px 12px; position: relative; }
        .chat-item:active { background: var(--glass-border); }
        .chat-item::after { content: ''; position: absolute; bottom: 0; left: 70px; right: 0; height: 1px; background: var(--glass-border); }
        .chat-item:last-child::after { display: none; }
        .chat-ava { width: 48px; height: 48px; border-radius: 50%; object-fit: cover; flex-shrink: 0; }
        .chat-content { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; height: 48px; }
        .chat-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 2px; }
        .chat-name { font-size: 16px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .chat-time { font-size: 13px; color: var(--text-sub); flex-shrink: 0; margin-left: 8px; }
        .chat-bottom { display: flex; justify-content: space-between; align-items: center; }
        .chat-msg { font-size: 14px; color: var(--text-sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .pin-icon { width: 14px; height: 14px; fill: var(--text-sub); transform: rotate(45deg); }

        /* Утилиты */
        .section-title { font-size: 16px; font-weight: 600; padding: 8px 12px 4px; }
        .btn { background: var(--accent); color: #fff; border: none; padding: 8px 16px; border-radius: 8px; font-weight: 600; font-size: 14px; text-align: center; display: inline-block; width: 100%; }
        
        /* Профиль */
        .profile-header { display: flex; flex-direction: column; align-items: center; padding: 20px 0 10px; gap: 8px; }
        .profile-ava { width: 80px; height: 80px; border-radius: 50%; object-fit: cover; }
        .menu-list { background: var(--bg-panel); border-radius: 12px; margin: 8px; overflow: hidden; }
        .menu-item { padding: 12px; border-bottom: 1px solid var(--glass-border); display: flex; justify-content: space-between; align-items: center; }
        .menu-item:last-child { border: none; }
    </style>
</head>
<body>

        // Логика роутинга SPA

            // Обновление активной кнопки в нижнем меню
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            const indexMap = { 'home': 0, 'services': 1, 'chats': 2, 'profile': 3 };
            if (indexMap[view] !== undefined) {
                document.querySelectorAll('.nav-item')[indexMap[view]].classList.add('active');
            }
            
            window.scrollTo(0,0);
        }

        // Запуск приложения

</body>
</html>
