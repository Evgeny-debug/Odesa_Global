<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Спільнота — супер-застосунок громади</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap');

:root{
  --bg:#0A0F16;
  --bg-2:#0D141C;
  --glass: rgba(255,255,255,0.045);
  --glass-2: rgba(255,255,255,0.07);
  --glass-strong: rgba(20,28,38,0.72);
  --border: rgba(255,255,255,0.08);
  --border-2: rgba(255,255,255,0.14);
  --text:#E9EEF3;
  --text-dim:#8B98A6;
  --text-faint:#5B6672;
  --accent:#5B93C9;
  --accent-2:#7CB0E0;
  --accent-soft: rgba(91,147,201,0.16);
  --gold:#C9A24A;
  --gold-2:#E0C067;
  --gold-soft: rgba(201,162,74,0.16);
  --danger:#C4574B;
  --danger-soft: rgba(196,87,75,0.16);
  --success:#5FAE7A;
  --success-soft: rgba(95,174,122,0.16);
  --radius:16px;
  --radius-sm:10px;
  --radius-lg:22px;
  --font-d:'Unbounded',sans-serif;
  --font-b:'Inter',sans-serif;
  --font-m:'JetBrains Mono',monospace;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  margin:0;
  background:
    radial-gradient(1200px 600px at 15% -10%, rgba(91,147,201,0.12), transparent 60%),
    radial-gradient(900px 500px at 100% 0%, rgba(201,162,74,0.08), transparent 55%),
    var(--bg);
  color:var(--text);
  font-family:var(--font-b);
  min-height:100vh;
  overflow-x:hidden;
}
::selection{ background:var(--accent-soft); }
::-webkit-scrollbar{ width:6px; height:6px; }
::-webkit-scrollbar-thumb{ background:var(--glass-2); border-radius:10px; }
a{ color:inherit; text-decoration:none; }
button{ font-family:inherit; cursor:pointer; }
input,textarea,select{ font-family:inherit; }
:focus-visible{ outline:2px solid var(--accent-2); outline-offset:2px; border-radius:6px; }

.glass{
  background:var(--glass-strong);
  backdrop-filter: blur(18px) saturate(140%);
  -webkit-backdrop-filter: blur(18px) saturate(140%);
  border:1px solid var(--border);
}
.glass-soft{
  background:var(--glass);
  backdrop-filter: blur(14px) saturate(130%);
  -webkit-backdrop-filter: blur(14px) saturate(130%);
  border:1px solid var(--border);
}

#app{ max-width:520px; margin:0 auto; min-height:100vh; position:relative; padding-bottom:78px; }

/* ---------- ICONS ---------- */
.ic{ width:19px; height:19px; display:inline-block; vertical-align:-4px; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }

/* ---------- TOP BAR ---------- */
.topbar{
  position:sticky; top:0; z-index:40;
  display:flex; align-items:center; gap:8px;
  padding:10px 12px;
  background:var(--glass-strong);
  backdrop-filter: blur(18px) saturate(140%);
  border-bottom:1px solid var(--border);
}
.loc-pill{
  display:flex; align-items:center; gap:5px;
  padding:6px 10px; border-radius:100px;
  background:var(--glass-2); border:1px solid var(--border);
  font-size:12px; color:var(--text-dim); white-space:nowrap; max-width:120px; overflow:hidden;
}
.loc-pill span{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--text); font-weight:600; }
.search-box{
  flex:1; display:flex; align-items:center; gap:6px;
  padding:7px 12px; border-radius:100px;
  background:var(--glass-2); border:1px solid var(--border);
  color:var(--text-dim);
}
.search-box input{ border:none; background:none; color:var(--text); outline:none; width:100%; font-size:13px; }
.coin-chip{
  display:flex; align-items:center; gap:5px;
  padding:6px 10px; border-radius:100px;
  background:var(--gold-soft); border:1px solid rgba(201,162,74,0.35);
  color:var(--gold-2); font-family:var(--font-m); font-weight:600; font-size:12.5px; white-space:nowrap;
}
.coin-chip.pulse{ animation:coinpulse .6s ease; }
@keyframes coinpulse{ 0%{transform:scale(1);} 40%{transform:scale(1.12); box-shadow:0 0 0 6px var(--gold-soft);} 100%{transform:scale(1);} }

/* ---------- LOGO / BRAND ---------- */
.brand{ font-family:var(--font-d); font-weight:700; letter-spacing:0.2px; }
.brand-mark{ display:inline-flex; align-items:center; gap:6px; }
.brand-coin{
  width:22px; height:22px; border-radius:50%;
  background:linear-gradient(145deg,var(--gold-2),var(--gold));
  display:flex; align-items:center; justify-content:center;
  font-family:var(--font-d); font-size:12px; font-weight:700; color:#241A05;
  flex:none;
}

/* ---------- SECTION TITLES ---------- */
.section{ padding:14px 12px 4px; }
.section-head{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:8px; }
.section-title{ font-family:var(--font-d); font-size:14.5px; font-weight:600; letter-spacing:.2px; }
.section-sub{ font-size:11.5px; color:var(--text-faint); }
.link-more{ font-size:12px; color:var(--accent-2); font-weight:600; }

/* ---------- AD BANNER STRIP (paid, top) ---------- */
.ad-strip{ padding:10px 12px 2px; }
.ad-label{ font-size:10px; letter-spacing:1.2px; text-transform:uppercase; color:var(--text-faint); margin-bottom:6px; padding-left:2px;}
.ad-scroll{ display:flex; gap:10px; overflow-x:auto; scroll-snap-type:x mandatory; padding-bottom:4px; }
.ad-scroll::-webkit-scrollbar{ display:none; }
.ad-card{
  scroll-snap-align:start; flex:none; width:270px; height:104px; border-radius:var(--radius);
  background:linear-gradient(135deg, rgba(201,162,74,0.22), rgba(91,147,201,0.14));
  border:1px solid rgba(201,162,74,0.3);
  padding:12px; position:relative; overflow:hidden;
  display:flex; flex-direction:column; justify-content:flex-end;
}
.ad-card .ad-badge{ position:absolute; top:8px; right:8px; font-size:9px; padding:2px 7px; border-radius:100px; background:rgba(0,0,0,0.35); color:var(--gold-2); letter-spacing:.5px;}
.ad-card h4{ margin:0 0 2px; font-family:var(--font-d); font-size:13px; }
.ad-card p{ margin:0; font-size:11px; color:var(--text-dim); }

/* ---------- FEED LIST / GRID ---------- */
.chips-row{ display:flex; gap:7px; overflow-x:auto; padding:2px 12px 10px; }
.chips-row::-webkit-scrollbar{ display:none; }
.chip{
  flex:none; padding:7px 13px; border-radius:100px; font-size:12.5px; font-weight:600;
  background:var(--glass); border:1px solid var(--border); color:var(--text-dim); white-space:nowrap;
}
.chip.active{ background:var(--accent-soft); border-color:rgba(91,147,201,0.4); color:var(--accent-2); }

.grid{ display:grid; grid-template-columns:1fr 1fr; gap:9px; padding:0 12px 14px; }
.card{
  border-radius:var(--radius); overflow:hidden; position:relative;
  background:var(--glass); border:1px solid var(--border);
  display:flex; flex-direction:column;
  animation:fadein .35s ease;
}
@keyframes fadein{ from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:none;} }
.card-img{
  aspect-ratio:1/0.82; width:100%; position:relative;
  display:flex; align-items:center; justify-content:center;
  color:var(--text-faint);
}
.card-img svg{ width:34%; height:34%; opacity:.5; }
.card-fav{
  position:absolute; top:7px; right:7px; width:28px; height:28px; border-radius:50%;
  background:rgba(10,15,22,0.55); backdrop-filter:blur(6px);
  display:flex; align-items:center; justify-content:center; border:1px solid var(--border);
}
.card-fav.active{ color:var(--danger); }
.card-fav svg{ width:15px; height:15px; }
.card-top-badge{
  position:absolute; top:7px; left:7px; display:flex; align-items:center; gap:3px;
  background:var(--gold-soft); border:1px solid rgba(201,162,74,0.4); color:var(--gold-2);
  font-size:9.5px; font-weight:700; padding:3px 7px; border-radius:100px; letter-spacing:.3px;
}
.card-top-badge svg{ width:10px; height:10px; }
.card-body{ padding:9px 10px 10px; display:flex; flex-direction:column; gap:3px; }
.card-price{ font-family:var(--font-m); font-weight:700; font-size:14.5px; color:var(--text); }
.card-price sup{ font-size:10px; color:var(--text-faint); font-weight:500; }
.card-title{ font-size:12.5px; color:var(--text-dim); line-height:1.3; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.card-meta{ display:flex; align-items:center; justify-content:space-between; margin-top:2px; }
.card-loc{ font-size:10.5px; color:var(--text-faint); display:flex; align-items:center; gap:3px; }
.card-loc svg{ width:11px; height:11px; }
.card-guarant{ display:flex; align-items:center; gap:2px; color:var(--success); font-size:10px; }
.card-guarant svg{ width:11px; height:11px; }

.list-row{
  display:flex; gap:10px; padding:10px; border-radius:var(--radius);
  background:var(--glass); border:1px solid var(--border); margin:0 12px 9px;
}
.list-thumb{
  width:64px; height:64px; border-radius:var(--radius-sm); flex:none;
  display:flex; align-items:center; justify-content:center; color:var(--text-faint);
  background:var(--glass-2);
}
.list-thumb svg{ width:44%; height:44%; opacity:.55; }
.list-body{ flex:1; min-width:0; }
.list-body h4{ margin:0 0 2px; font-size:13px; font-weight:600; }
.list-sub{ font-size:11.5px; color:var(--text-dim); margin-bottom:4px; }
.pin-badge{ display:inline-flex; align-items:center; gap:3px; font-size:9.5px; color:var(--accent-2); background:var(--accent-soft); padding:2px 7px; border-radius:100px; font-weight:700;}
.pin-badge svg{width:10px;height:10px;}

/* ---------- BOTTOM NAV ---------- */
.dock{
  position:fixed; bottom:10px; left:50%; transform:translateX(-50%);
  width:calc(100% - 24px); max-width:496px; z-index:50;
  display:flex; align-items:center; justify-content:space-around;
  padding:8px 6px; border-radius:100px;
  background:var(--glass-strong);
  border:1px solid var(--border-2);
  box-shadow:0 10px 30px rgba(0,0,0,0.35);
}
.dock-item{
  display:flex; flex-direction:column; align-items:center; gap:2px;
  color:var(--text-faint); font-size:9.5px; padding:5px 9px; border-radius:14px; position:relative;
  flex:1;
}
.dock-item svg{ width:20px; height:20px; }
.dock-item.active{ color:var(--accent-2); background:var(--accent-soft); }
.dock-item .dot{ position:absolute; top:3px; right:14px; width:6px; height:6px; border-radius:50%; background:var(--danger); }

/* ---------- CATEGORY TABS (super-app top) ---------- */
.cat-tabs{ display:flex; gap:6px; padding:4px 12px 10px; overflow-x:auto; }
.cat-tabs::-webkit-scrollbar{ display:none; }
.cat-tab{
  flex:none; display:flex; flex-direction:column; align-items:center; gap:5px;
  padding:10px 14px; border-radius:var(--radius); background:var(--glass); border:1px solid var(--border);
  color:var(--text-dim); font-size:10.5px; font-weight:600; min-width:70px;
}
.cat-tab svg{ width:19px; height:19px; }
.cat-tab.active{ background:var(--accent-soft); border-color:rgba(91,147,201,.4); color:var(--accent-2); }

/* ---------- BUTTONS ---------- */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:6px;
  padding:11px 16px; border-radius:100px; border:1px solid var(--border-2);
  background:var(--glass-2); color:var(--text); font-weight:600; font-size:13.5px;
}
.btn svg{ width:16px; height:16px; }
.btn-primary{ background:linear-gradient(135deg,var(--accent-2),var(--accent)); border:none; color:#08131F; }
.btn-gold{ background:linear-gradient(135deg,var(--gold-2),var(--gold)); border:none; color:#241A05; }
.btn-ghost{ background:transparent; border:1px solid var(--border); }
.btn-danger{ background:var(--danger-soft); border-color:rgba(196,87,75,.4); color:#F3B9B2; }
.btn-block{ width:100%; }
.btn-sm{ padding:7px 12px; font-size:12px; }

/* ---------- FAB ---------- */
.fab{
  position:fixed; bottom:88px; right:calc(50% - 260px + 14px); z-index:49;
  width:52px; height:52px; border-radius:50%;
  background:linear-gradient(135deg,var(--accent-2),var(--accent));
  display:flex; align-items:center; justify-content:center;
  color:#08131F; box-shadow:0 10px 26px rgba(91,147,201,.35);
  border:none;
}
.fab svg{ width:23px; height:23px; }
@media(max-width:560px){ .fab{ right:16px; } }

/* ---------- MODAL / SHEET ---------- */
.overlay{
  position:fixed; inset:0; background:rgba(5,8,12,0.6); backdrop-filter:blur(3px);
  z-index:100; display:flex; align-items:flex-end; justify-content:center;
  animation:fadein2 .18s ease;
}
@keyframes fadein2{ from{opacity:0;} to{opacity:1;} }
.sheet{
  width:100%; max-width:520px; max-height:88vh; overflow-y:auto;
  background:var(--bg-2); border-top-left-radius:24px; border-top-right-radius:24px;
  border:1px solid var(--border-2); border-bottom:none;
  padding:14px 16px calc(20px + env(safe-area-inset-bottom));
  animation:slideup .22s cubic-bezier(.22,.9,.32,1);
}
@keyframes slideup{ from{transform:translateY(100%);} to{transform:translateY(0);} }
.sheet-handle{ width:36px; height:4px; border-radius:4px; background:var(--glass-2); margin:2px auto 12px; }
.sheet-close{
  position:absolute; top:14px; right:16px; width:30px; height:30px; border-radius:50%;
  background:var(--glass-2); display:flex; align-items:center; justify-content:center; border:1px solid var(--border);
}
.sheet-close svg{ width:15px; height:15px; }

/* ---------- FORMS ---------- */
.field{ margin-bottom:12px; }
.field label{ display:block; font-size:12px; color:var(--text-dim); margin-bottom:6px; font-weight:600; }
.field input, .field textarea, .field select{
  width:100%; padding:11px 13px; border-radius:var(--radius-sm); background:var(--glass-2);
  border:1px solid var(--border); color:var(--text); font-size:13.5px; outline:none;
}
.field textarea{ resize:vertical; min-height:70px; }
.field-row{ display:flex; gap:8px; }
.field-row .field{ flex:1; }
.helper{ font-size:11px; color:var(--text-faint); margin-top:5px; }

/* ---------- DEAL / GUARANTOR ---------- */
.guarantor-box{
  display:flex; gap:10px; padding:12px; border-radius:var(--radius); margin:10px 0;
  background:var(--success-soft); border:1px solid rgba(95,174,122,.35);
}
.guarantor-box svg{ width:22px; height:22px; color:var(--success); flex:none; margin-top:1px;}
.guarantor-box p{ margin:0; font-size:12px; line-height:1.5; color:#CFE9D8; }
.guarantor-box b{ color:var(--success); }

/* ---------- DETAIL PAGE ---------- */
.detail-gallery{
  width:100%; aspect-ratio:1/0.85; background:var(--glass); display:flex; align-items:center; justify-content:center;
  color:var(--text-faint); position:relative;
}
.detail-gallery svg{ width:26%; height:26%; opacity:.4; }
.detail-back{
  position:absolute; top:12px; left:12px; width:34px; height:34px; border-radius:50%;
  background:rgba(10,15,22,0.55); backdrop-filter:blur(8px); border:1px solid var(--border);
  display:flex; align-items:center; justify-content:center; z-index:5;
}
.detail-fav{
  position:absolute; top:12px; right:12px; width:34px; height:34px; border-radius:50%;
  background:rgba(10,15,22,0.55); backdrop-filter:blur(8px); border:1px solid var(--border);
  display:flex; align-items:center; justify-content:center; z-index:5;
}
.detail-body{ padding:16px; }
.detail-price{ font-family:var(--font-m); font-size:26px; font-weight:700; }
.detail-title{ font-family:var(--font-d); font-size:16px; font-weight:600; margin:6px 0 8px; line-height:1.35;}
.detail-metarow{ display:flex; align-items:center; gap:12px; color:var(--text-faint); font-size:12px; margin-bottom:14px; flex-wrap:wrap;}
.detail-metarow span{ display:flex; align-items:center; gap:4px; }
.detail-metarow svg{ width:13px; height:13px; }
.specs{ display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:14px 0; }
.spec-item{ background:var(--glass); border:1px solid var(--border); border-radius:var(--radius-sm); padding:9px 11px; }
.spec-item .k{ font-size:10.5px; color:var(--text-faint); margin-bottom:2px; }
.spec-item .v{ font-size:12.5px; font-weight:600; }
.desc-block{ font-size:13px; line-height:1.6; color:var(--text-dim); margin:14px 0; }
.seller-row{
  display:flex; align-items:center; gap:10px; padding:12px; border-radius:var(--radius);
  background:var(--glass); border:1px solid var(--border); margin:14px 0;
}
.avatar{
  width:42px; height:42px; border-radius:50%; flex:none;
  background:linear-gradient(135deg,var(--accent-2),var(--gold)); display:flex; align-items:center; justify-content:center;
  font-family:var(--font-d); font-weight:700; color:#08131F; font-size:15px;
}
.seller-info h4{ margin:0; font-size:13px; }
.seller-info p{ margin:2px 0 0; font-size:11px; color:var(--text-faint); }
.action-bar{ position:sticky; bottom:0; display:flex; gap:8px; padding:12px 16px 4px; background:linear-gradient(180deg,transparent,var(--bg) 30%); }

/* ---------- TOKEN / WALLET ---------- */
.wallet-hero{
  margin:12px; padding:20px; border-radius:var(--radius-lg);
  background:linear-gradient(135deg, rgba(201,162,74,0.22), rgba(91,147,201,0.1));
  border:1px solid rgba(201,162,74,0.3); position:relative; overflow:hidden;
}
.wallet-hero .lbl{ font-size:11px; color:var(--gold-2); letter-spacing:.5px; text-transform:uppercase; margin-bottom:6px;}
.wallet-hero .amt{ font-family:var(--font-m); font-size:34px; font-weight:700; display:flex; align-items:center; gap:8px; }
.wallet-actions{ display:flex; gap:8px; margin-top:14px; }
.task-row{
  display:flex; align-items:center; gap:10px; padding:12px; border-radius:var(--radius); margin:0 12px 9px;
  background:var(--glass); border:1px solid var(--border);
}
.task-icon{ width:38px; height:38px; border-radius:12px; background:var(--accent-soft); display:flex; align-items:center; justify-content:center; color:var(--accent-2); flex:none;}
.task-icon svg{ width:18px; height:18px; }
.task-body{ flex:1; }
.task-body h4{ margin:0; font-size:12.5px; }
.task-body p{ margin:2px 0 0; font-size:11px; color:var(--text-faint); }
.task-reward{ font-family:var(--font-m); font-size:12px; color:var(--gold-2); font-weight:700; white-space:nowrap; }

/* ---------- CHAT ---------- */
.chat-wrap{ display:flex; flex-direction:column; min-height:calc(100vh - 130px); }
.chat-messages{ flex:1; padding:12px; display:flex; flex-direction:column; gap:8px; }
.msg{ max-width:78%; padding:9px 12px; border-radius:16px; font-size:13px; line-height:1.4; }
.msg.in{ align-self:flex-start; background:var(--glass); border:1px solid var(--border); border-bottom-left-radius:4px; }
.msg.out{ align-self:flex-end; background:linear-gradient(135deg,var(--accent-2),var(--accent)); color:#08131F; border-bottom-right-radius:4px; font-weight:500;}
.msg .who{ font-size:10px; color:var(--gold-2); font-weight:700; margin-bottom:2px; }
.msg .time{ font-size:9px; opacity:.6; margin-top:3px; text-align:right; }
.chat-input-bar{
  position:sticky; bottom:0; display:flex; gap:8px; padding:10px 12px calc(10px + env(safe-area-inset-bottom));
  background:var(--glass-strong); border-top:1px solid var(--border);
}
.chat-input-bar input{ flex:1; padding:11px 14px; border-radius:100px; background:var(--glass-2); border:1px solid var(--border); color:var(--text); outline:none; font-size:13px; }
.chat-send{ width:42px; height:42px; border-radius:50%; background:var(--accent); border:none; display:flex; align-items:center; justify-content:center; color:#08131F; flex:none; }
.chat-send svg{ width:18px; height:18px; }

/* ---------- PROFILE / CABINET ---------- */
.profile-hero{ display:flex; align-items:center; gap:12px; padding:16px; }
.profile-hero .avatar{ width:58px; height:58px; font-size:20px; }
.profile-hero h2{ margin:0; font-family:var(--font-d); font-size:16px; }
.profile-hero p{ margin:3px 0 0; font-size:12px; color:var(--text-faint); }
.stat-row{ display:flex; gap:8px; padding:0 12px 12px; }
.stat-box{ flex:1; padding:12px; border-radius:var(--radius); background:var(--glass); border:1px solid var(--border); text-align:center; }
.stat-box .n{ font-family:var(--font-m); font-size:16px; font-weight:700; }
.stat-box .l{ font-size:10px; color:var(--text-faint); margin-top:2px; }
.menu-list{ padding:0 12px; }
.menu-item{
  display:flex; align-items:center; gap:12px; padding:13px 14px; border-radius:var(--radius);
  background:var(--glass); border:1px solid var(--border); margin-bottom:8px; color:var(--text);
}
.menu-item svg{ width:18px; height:18px; color:var(--text-dim); }
.menu-item .grow{ flex:1; font-size:13px; font-weight:500; }
.menu-item .chev{ color:var(--text-faint); }

/* ---------- ONBOARDING ---------- */
.onb-overlay{ position:fixed; inset:0; z-index:200; background:var(--bg); display:flex; flex-direction:column; }
.onb-hero{ padding:40px 22px 10px; text-align:center; }
.onb-hero .brand-coin{ width:56px; height:56px; font-size:24px; margin:0 auto 16px; }
.onb-hero h1{ font-family:var(--font-d); font-size:20px; margin:0 0 6px; }
.onb-hero p{ font-size:13px; color:var(--text-dim); line-height:1.5; max-width:320px; margin:0 auto; }
.onb-body{ flex:1; overflow-y:auto; padding:16px 20px; }
.onb-search{ display:flex; align-items:center; gap:8px; padding:11px 14px; border-radius:100px; background:var(--glass-2); border:1px solid var(--border); margin-bottom:14px;}
.onb-search input{ flex:1; background:none; border:none; outline:none; color:var(--text); font-size:14px; }
.city-list{ display:flex; flex-direction:column; gap:7px; }
.city-item{ display:flex; align-items:center; justify-content:space-between; padding:13px 15px; border-radius:var(--radius); background:var(--glass); border:1px solid var(--border);}

.city-item .cr{ font-size:11px; color:var(--text-faint); }
.onb-footer{ padding:14px 20px calc(18px + env(safe-area-inset-bottom)); }

/* ---------- EMPTY STATE ---------- */
.empty{ text-align:center; padding:50px 30px; color:var(--text-faint); }
.empty svg{ width:44px; height:44px; opacity:.4; margin-bottom:10px; }
.empty h4{ margin:0 0 4px; color:var(--text-dim); font-size:14px; }
.empty p{ margin:0; font-size:12px; }

/* ---------- TOAST ---------- */
.toast{
  position:fixed; bottom:96px; left:50%; transform:translateX(-50%); z-index:300;
  background:var(--glass-strong); border:1px solid var(--border-2); padding:11px 18px; border-radius:100px;
  font-size:12.5px; display:flex; align-items:center; gap:8px; box-shadow:0 10px 24px rgba(0,0,0,.4);
  animation:toastin .25s ease;
}
@keyframes toastin{ from{opacity:0; transform:translate(-50%,10px);} to{opacity:1; transform:translate(-50%,0);} }
.toast svg{ width:16px; height:16px; color:var(--success); }

.hero-lobby{

.section-divider{ height:1px; background:var(--border); margin:6px 12px 0; }

.badge-choice{ display:flex; gap:8px; margin-top:6px; flex-wrap:wrap; }

function fmtPrice(item){
  const unit = item.priceUnit || '₴';
  if(unit==='$') return '$'+item.price.toLocaleString('uk-UA');
  if(unit==='грн/міс') return item.price.toLocaleString('uk-UA')+' <sup>грн/міс</sup>';
  return item.price.toLocaleString('uk-UA')+' <sup>₴</sup>';
}
function timeAgo(ts){
  const diff = Date.now()-ts, h=Math.floor(diff/3600000);
  if(h<1) return 'щойно';
  if(h<24) return h+' год тому';
  return Math.floor(h/24)+' дн тому';
}

  const root = document.getElementById('toast-root');
  const el = document.createElement('div');
  el.className='toast';

function renderOnboarding(){
  const app = document.getElementById('app');
  let filter = '';
  function list(){
    const q = filter.trim().toLowerCase();
    const arr = CITIES.filter(c=>!q || c.city.toLowerCase().includes(q));
    return arr.map(c=>`
      <div class="city-item" data-city="${c.city}" data-region="${c.region}" onclick="window.__pickCity(this)">
        <div><div class="cn">${c.city}</div><div class="cr">${c.region}</div></div>
        ${I.chevR}
      </div>`).join('') || `<div class="empty">${I.search}<h4>Нічого не знайдено</h4><p>Спробуйте інший запит</p></div>`;
  }
  app.innerHTML = `
    <div class="onb-overlay">
      <div class="onb-hero">
        <div class="brand-coin">С</div>
        <h1>Вітаємо у Спільноті</h1>
        <p>Оберіть своє місто чи село, щоб бачити оголошення, послуги та новини саме вашої громади.</p>
      </div>
      <div class="onb-body">
        <div class="onb-search">${I.search}<input id="onbInput" placeholder="Пошук міста або села…" oninput="window.__filterCity(this.value)"></div>
        <div class="city-list" id="cityList">${list()}</div>
      </div>
      <div class="onb-footer"><button class="btn btn-ghost btn-block" onclick="window.__skipCity()">Визначити автоматично</button></div>
    </div>`;
  window.__filterCity = (v)=>{ filter=v; document.getElementById('cityList').innerHTML=list(); };
  window.__pickCity = (el)=>{
    S.location = {city:el.dataset.city, region:el.dataset.region};
    S.onboarded = true; save(); render();
  };
  window.__skipCity = ()=>{
    S.location = {city:'Одеса', region:'Одеська обл.'};
    S.onboarded = true; save(); render();
  };
}

let __createBoost = 0;
window.__setCreateCat = function(id){ nav('create/'+id); };
window.__pickBoost = function(el, val){
  document.querySelectorAll('.pill-choice').forEach(p=>p.classList.remove('active'));
  el.classList.add('active'); __createBoost = val;
};
window.__publish = function(catId){
  const title = document.getElementById('cTitle').value.trim();
  const price = parseFloat(document.getElementById('cPrice').value)||0;
  const unit = document.getElementById('cUnit').value;
  const desc = document.getElementById('cDesc').value.trim() || 'Опис відсутній.';
  if(!title){ toast('Вкажіть назву оголошення', I.info); return; }
  if(__createBoost===1 && S.user.balance<60){ toast('Недостатньо токенів для топу', I.coin); return; }
  const item = {
    id:uid(), cat:catId, title, price, priceUnit:unit==='₴'?undefined:unit, desc,
    city:S.location.city, seller:S.user.name, specs:[['Стан','Вказано продавцем']],
    createdAt:Date.now(), views:0, favCount:0, isTop: __createBoost>0, pinned: catId==='services' && __createBoost>0
  };
  S.listings.unshift(item);
  S.user.listingsCount++;
  if(__createBoost===1){ S.user.balance -= 60; S.tokenHistory.unshift({id:uid(), text:'Буст оголошення «'+title+'»', amount:-60, t:'щойно'}); }
  save(); __createBoost=0;
  nav('item/'+item.id);
  toast('Оголошення опубліковано', I.check);
};

  openSheet(`
    <div class="sheet-handle"></div>
    <h3 style="font-family:var(--font-d);font-size:15px;margin:0 0 8px;">${I.coin} Конвертація в готівку</h3>
    <p style="font-size:12.5px;color:var(--text-dim);line-height:1.5;margin:0 0 14px;">Курс: 1 токен ≈ 1 ₴. Заявку опрацює адміністратор-гарант протягом 24 годин.</p>
    <button class="btn btn-primary btn-block" onclick="window.__cashOutConfirm()">Надіслати заявку на ${S.user.balance} ₴</button>
  `);
};
window.__cashOutConfirm = function(){ closeSheet(); toast('Заявку на виплату надіслано гаранту', I.check); };

/* ============================================================
   СТОРІНКА: СПІЛЬНИЙ ЧАТ
============================================================ */
function pageCommunity(){
  return `
  <div class="topbar"><div class="detail-back" style="position:static;" onclick="history.back()">${I.back}</div>
    <div class="brand" style="font-size:13.5px;">Чат громади «${S.location.city}»</div></div>
  <div class="chat-wrap">
    <div class="chat-messages" id="chatMsgs">
      ${S.chatMessages.map(m=>`
        <div class="msg ${m.mine?'out':'in'}">
          ${!m.mine? `<div class="who">${m.who}</div>`:''}
          ${m.text}
          <div class="time">${m.t}</div>
        </div>`).join('')}
    </div>
    <div class="chat-input-bar">
      <input id="chatInput" placeholder="Написати спільноті…" onkeydown="if(event.key==='Enter')window.__sendMsg()">
      <button class="chat-send" onclick="window.__sendMsg()">${I.send}</button>
    </div>
  </div>
  ${dockHTML('community')}
  `;
}
window.__sendMsg = function(){
  const inp = document.getElementById('chatInput');
  const text = inp.value.trim(); if(!text) return;
  S.chatMessages.push({id:uid(), who:S.user.name, text, mine:true, t:'зараз'});
  save(); render();
  setTimeout(()=>{ const box=document.getElementById('chatMsgs'); if(box) box.scrollTop = box.scrollHeight; }, 30);
};

/* ============================================================
   КОШИК / ОБРАНЕ
============================================================ */
function pageCart(){
  const items = S.cart.map(id=>S.listings.find(l=>l.id===id)).filter(Boolean);
  const total = items.reduce((s,i)=>s+i.price,0);
  return `
  ${topbarHTML(false)}
  <div class="section"><div class="section-title">Кошик</div><div class="section-sub">${items.length} товарів</div></div>
  ${items.length? items.map(i=>`
    <div class="list-row">
      <div class="list-thumb">${catIcon(i.cat)}</div>
      <div class="list-body"><h4>${i.title}</h4><div class="card-price" style="font-size:13px">${fmtPrice(i)}</div></div>
      <button class="btn btn-ghost btn-sm" onclick="window.__removeCart('${i.id}')">${I.close}</button>
    </div>`).join('') : `<div class="empty">${I.cart}<h4>Кошик порожній</h4><p>Додайте товари з каталогу</p></div>`}
  ${items.length? `
  <div class="section">
    <div class="guarantor-box">${I.shield}<p>Оформлення замовлення відбувається через адміна-гаранта: він зв'яже вас з кожним продавцем окремо.</p></div>
    <div style="display:flex;justify-content:space-between;margin:12px 0;font-family:var(--font-m);font-weight:700;">
      <span>Разом</span><span>${total.toLocaleString('uk-UA')} ₴</span>
    </div>
    <button class="btn btn-primary btn-block" onclick="window.__checkout()">${I.shield} Оформити через гаранта</button>
  </div>`:''}
  ${dockHTML('cart')}
  `;
}
window.__removeCart = function(id){ S.cart = S.cart.filter(c=>c!==id); save(); render(); };
window.__checkout = function(){ S.cart=[]; save(); render(); toast('Запити надіслано продавцям через гаранта', I.shield); };

function pageFavorites(){
  const items = S.favorites.map(id=>S.listings.find(l=>l.id===id)).filter(Boolean);
  return `
  ${topbarHTML(false)}
  <div class="section"><div class="section-title">Обране</div><div class="section-sub">${items.length} збережених оголошень</div></div>
  ${items.length? `<div class="grid">${items.map(cardGridHTML).join('')}</div>` : `<div class="empty">${I.heart}<h4>Тут поки пусто</h4><p>Тисніть ♡ на картках, щоб зберегти</p></div>`}
  ${dockHTML('')}
  `;
}

/* ============================================================
   ОСОБИСТИЙ КАБІНЕТ
============================================================ */
function pageProfile(){
  const my = S.listings.filter(l=>l.seller===S.user.name);
  return `
  ${topbarHTML(false)}
  <div class="profile-hero">
    <div class="avatar">${initials(S.user.name)}</div>
    <div><h2>${S.user.name}</h2><p>${S.location.city} · на платформі з ${S.user.joined}</p></div>
  </div>
  <div class="stat-row">
    <div class="stat-box"><div class="n">${S.user.listingsCount}</div><div class="l">Оголошення</div></div>
    <div class="stat-box"><div class="n">${S.user.deals}</div><div class="l">Угод</div></div>
    <div class="stat-box"><div class="n">★ ${S.user.rating}</div><div class="l">Рейтинг</div></div>
  </div>
  <div class="menu-list">
    <div class="menu-item" onclick="nav('tokens')">${I.coin}<span class="grow">Гаманець · ${S.user.balance} токенів</span><span class="chev">${I.chevR}</span></div>
    <div class="menu-item" onclick="nav('favorites')">${I.heart}<span class="grow">Обране</span><span class="chev">${I.chevR}</span></div>
    <div class="menu-item" onclick="window.__myListingsSheet()">${I.box}<span class="grow">Мої оголошення (${my.length})</span><span class="chev">${I.chevR}</span></div>
    <div class="menu-item" onclick="window.__myDealsSheet()">${I.shield}<span class="grow">Угоди через гаранта (${S.deals.length})</span><span class="chev">${I.chevR}</span></div>
    <div class="menu-item" onclick="window.__openLocationSheet()">${I.move}<span class="grow">Переїжджаю — змінити локацію</span><span class="chev">${I.chevR}</span></div>
    <div class="menu-item" onclick="window.__editName()">${I.user}<span class="grow">Змінити ім'я</span><span class="chev">${I.chevR}</span></div>
    <div class="menu-item" onclick="window.__resetDemo()">${I.logout}<span class="grow">Скинути демо-дані</span><span class="chev">${I.chevR}</span></div>
  </div>
  ${dockHTML('profile')}
  `;
}
window.__myListingsSheet = function(){
  const my = S.listings.filter(l=>l.seller===S.user.name);
  openSheet(`<div class="sheet-handle"></div><h3 style="font-family:var(--font-d);font-size:15px;margin:0 0 12px;">Мої оголошення</h3>
    ${my.length? my.map(listRowHTML).join('') : `<div class="empty">${I.box}<h4>Ще немає оголошень</h4></div>`}`);
};
window.__myDealsSheet = function(){
  openSheet(`<div class="sheet-handle"></div><h3 style="font-family:var(--font-d);font-size:15px;margin:0 0 12px;">Угоди через гаранта</h3>
    ${S.deals.length? S.deals.map(d=>`
      <div class="list-row"><div class="list-thumb">${I.shield}</div>
        <div class="list-body"><h4>${d.title}</h4><div class="list-sub">Продавець: ${d.seller}</div>
        <span class="pin-badge">${I.clock}${d.status}</span></div>
      </div>`).join('') : `<div class="empty">${I.shield}<h4>Угод ще не було</h4></div>`}`);
};
window.__editName = function(){
  openSheet(`<div class="sheet-handle"></div><h3 style="font-family:var(--font-d);font-size:15px;margin:0 0 12px;">Змінити ім'я</h3>
    <div class="field"><input id="nameInput" value="${S.user.name}"></div>
    <button class="btn btn-primary btn-block" onclick="window.__saveName()">Зберегти</button>`);
};
window.__saveName = function(){
  const v = document.getElementById('nameInput').value.trim();
  if(v){ S.user.name = v; save(); }
  closeSheet(); render();
};
window.__resetDemo = function(){
  if(confirm('Скинути всі демо-дані застосунку?')){ localStorage.removeItem(LS_KEY); S = defaultState(); save(); render(); }
};

/* ============================================================
   ПОШУК
============================================================ */
function pageSearch(){
  return `
  <div class="topbar">
    <div class="detail-back" style="position:static;" onclick="history.back()">${I.back}</div>
    <div class="search-box"><input id="searchInput" placeholder="Що шукаємо?" autofocus oninput="window.__doSearch(this.value)">${I.search}</div>
  </div>
  <div id="searchResults" class="grid"></div>
  ${dockHTML('')}
  `;
}
window.__doSearch = function(q){
  q = q.trim().toLowerCase();
  const root = document.getElementById('searchResults');
  if(!q){ root.innerHTML=''; return; }
  const res = S.listings.filter(l=>l.title.toLowerCase().includes(q) || l.desc.toLowerCase().includes(q));
  root.innerHTML = res.length? res.map(cardGridHTML).join('') : `<div class="empty" style="grid-column:1/-1">${I.search}<h4>Нічого не знайдено</h4></div>`;
};

/* ============================================================
   ГОЛОВНИЙ RENDER
============================================================ */
function render(){
  const app = document.getElementById('app');
  if(!S.onboarded || !S.location){ renderOnboarding(); return; }
  const {name, params} = currentRoute();
  let html = '';
  switch(name){
    case 'lobby': html = pageLobby(); break;
    case 'catalog': html = pageCatalog(params[0]); break;
    case 'item': html = pageItem(params[0]); break;
    case 'create': html = pageCreate(params[0]); break;
    case 'tokens': html = pageTokens(); break;
    case 'community': html = pageCommunity(); break;
    case 'cart': html = pageCart(); break;
    case 'favorites': html = pageFavorites(); break;
    case 'profile': html = pageProfile(); break;
    case 'search': html = pageSearch(); break;
    default: html = pageLobby();
  }
  app.innerHTML = html;
  window.scrollTo(0,0);
}
window.nav = nav;

render();
})();
</script>
</body>
</html>
